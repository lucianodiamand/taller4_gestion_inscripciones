<a class="volver" routerLink="/menu">
    ← Menú principal
</a>

<h2>Materias</h2>

<a class="nuevo" routerLink="/materias/crear">
    Nueva materia
</a>

<div
    class="card"
    *ngFor="let materia of materias$ | async">

    <div class="dato">
        <strong>ID:</strong>
        <span>{{ materia.id }}</span>
    </div>

    <div class="dato">
        <strong>Nombre:</strong>
        <span>{{ materia.nombre }}</span>
    </div>

    <div class="dato">
        <strong>Año:</strong>
        <span>{{ materia.anio }}</span>
    </div>

    <div class="dato">
        <strong>Cuatrimestre:</strong>
        <span>{{ materia.cuatrimestre }}</span>
    </div>

    <div class="dato">
        <strong>Carrera:</strong>
        <span>{{ materia.nombreCarrera }}</span>
    </div>

    <div class="acciones">

        <a
            class="editar"
            [routerLink]="['/materias/editar', materia.id]">

            Editar

        </a>

        <button
            class="borrar"
            (click)="borrar(materia.id)">

            Borrar

        </button>

    </div>

</div>
