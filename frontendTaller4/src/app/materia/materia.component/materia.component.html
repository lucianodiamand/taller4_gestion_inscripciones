<p>Materia works!</p>

<p><a routerLink="/materias/crear">Nueva materia</a></p>

<ul>
    <li *ngFor="let materia of materias$ | async"> <!-- | async sirve para subscribirse automaticamente al observable y obtener los datos del backend -->
        {{ materia.id }}: {{ materia.nombre }}: {{ materia.anio }}: {{ materia.cuatrimestre }}: {{ materia.nombreCarrera }}
        <a [routerLink]="['/materias/editar', materia.id]">Editar</a>
        <!-- [] significan que el destino va a ser dinamico, segun el id de la carrera recorrida por medio del ngfor -->
        <button (click)="borrar(materia.id)">Borrar</button>  
    </li>
</ul>
