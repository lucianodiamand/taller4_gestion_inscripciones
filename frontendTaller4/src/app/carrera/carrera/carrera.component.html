<p>carrera works!</p>

<p><a routerLink="/carrera/crear">Nueva Carrera</a></p>

<ul>
    <li *ngFor="let carrera of carreras$ | async">
        {{ carrera.id }}: {{ carrera.nombre }} ({{ carrera.duracionAnios }} años)
        
        <a [routerLink]="['/carrera/editar', carrera.id]">Editar</a>
        <button (click)="borrar(carrera.id)">Borrar</button>  
    </li>
</ul>
