<p>carrera-form-component works!</p>

<h2>{{ isEditMode ? 'Editar Carrera' : 'Nueva Carrera' }}</h2>

<form [formGroup]="carreraForm" (ngSubmit)="guardar()">
    <p>
        <label>Nombre: </label>
        <input type="text" formControlName="nombre" />
    </p>
    
    <p>
        <label>Duración (años): </label>
        <input type="number" formControlName="duracionAnios" />
    </p>

    <p>
        <button type="submit" [disabled]="carreraForm.invalid">
            {{ isEditMode ? 'Actualizar' : 'Guardar' }}
        </button>
        <a routerLink="/carrera"> Cancelar</a>
    </p>
</form>
