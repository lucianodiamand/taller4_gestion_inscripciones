<h2>Inscripción a Carrera</h2>

<!-- FORMULARIO DE INSCRIPCIÓN -->
<form [formGroup]="inscripcionForm" (ngSubmit)="guardar()">
  <p>
    <label for="ingresante">Ingresante: </label>
    <select id="ingresante" formControlName="ingresanteId">
      <option value="" disabled selected>Seleccione un ingresante</option>
      <option *ngFor="let ing of ingresantes" [value]="ing.id">
        {{ ing.nombre }} {{ ing.apellido }} (Doc: {{ ing.numeroDocumento }})
      </option>
    </select>
  </p>

  <p>
    <label for="carrera">Carrera: </label>
    <select id="carrera" formControlName="carreraId">
      <option value="" disabled selected>Seleccione una carrera</option>
      <option *ngFor="let car of carreras" [value]="car.id">
        {{ car.nombre }}
      </option>
    </select>
  </p>

  <p>
    <label for="fecha">Fecha de Inscripción: </label>
    <input type="date" id="fecha" formControlName="fechaInscripcion" />
  </p>

  <button type="submit" [disabled]="inscripcionForm.invalid">Inscribir</button>
</form>

<hr />

<!-- LISTADO DE INSCRIPCIONES REALIZADAS -->
<h3>Inscripciones Registradas</h3>

<table border="1" cellpadding="8" cellspacing="0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Fecha</th>
      <th>Ingresante</th>
      <th>Carrera</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let insc of inscripciones">
      <td>{{ insc.id }}</td>
      <td>{{ insc.fechaInscripcion }}</td>
      <td>{{ insc.nombreIngresante }} {{ insc.apellidoIngresante }}</td>
      <td>{{ insc.nombreCarrera }}</td>
    </tr>
    <tr *ngIf="inscripciones.length === 0">
      <td colspan="4">No hay inscripciones registradas.</td>
    </tr>
  </tbody>
</table>
