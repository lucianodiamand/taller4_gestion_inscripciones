<div class="auth-container">
  <p-card header="Iniciar Sesión" class="auth-card">
    
    @if (errorMensaje) {
      <p-message severity="error" [text]="errorMensaje" class="error-msg" />
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      
      <!-- Campo Usuario -->
      <div class="field">
        <label for="username">Usuario</label>
        <p-iconfield>
          <p-inputicon class="pi pi-user" />
          <input 
            pInputText 
            id="username" 
            type="text" 
            formControlName="username" 
            placeholder="Ingresa tu usuario"
          />
        </p-iconfield>
      </div>

      <!-- Campo Contraseña -->
      <div class="field">
        <label for="password">Contraseña</label>
        <p-password 
          id="password" 
          formControlName="password" 
          [toggleMask]="true" 
          [feedback]="false"
          placeholder="Ingresa tu contraseña"
        />
      </div>

      <!-- Botón de Submit -->
      <p-button 
        type="submit" 
        label="Ingresar" 
        icon="pi pi-sign-in" 
        [disabled]="form.invalid"
      />

    </form>

    <!-- Enlace de Registro -->
    <ng-template pTemplate="footer">
      <p class="register-link">
        ¿No tienes cuenta? 
        <a routerLink="/registro">Regístrate aquí</a>
      </p>
    </ng-template>

  </p-card>
</div>
