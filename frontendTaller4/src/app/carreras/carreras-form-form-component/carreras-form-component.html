<a class="volver" routerLink="/menu">
    <i class="pi pi-arrow-left"></i>
    Menú principal
</a>
<h2>Carrera</h2>

<form [formGroup]="carreraForm" (ngSubmit)="guardar()">

    <div>
        <label for="nombre">
            Nombre
        </label>

        <input pInputText id="nombre" type="text" formControlName="nombre"/>
    </div>

    <br>

    <div>
        <label for="duracion">
            Duración
        </label>

        <p-inputnumber inputId="duracion" formControlName="duracion" [min]="1" [showButtons]="true"> </p-inputnumber>
    </div>

    <br>

    <p-button type="submit" label="Guardar" icon="pi pi-save"> </p-button>

</form>
