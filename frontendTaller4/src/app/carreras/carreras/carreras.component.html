<a routerLink="/menu">
  ← Menú principal
</a>

<h2>Carreras</h2>

@if (rol === 'ADMIN') {
  <p-button label="Nueva carrera" icon="pi pi-plus" routerLink="/carrera/crear"> </p-button>
}

<br><br>


<p-table
  [value]="(carreras$ | async) ?? []" stripedRows>

  <ng-template #header>

    <tr>
      <th>Nombre</th>
      <th>Duración</th>
      <th>Materias</th>

      @if (rol === 'ADMIN') {
        <th>Acciones</th>
      }

    </tr>

  </ng-template>


  <ng-template #body let-carrera>

    <tr>

      <td>
        {{ carrera.nombre }}
      </td>

      <td>
        {{ carrera.duracion }} años
      </td>

      <td>

        <p-button label="Ver materias" icon="pi pi-book" [routerLink]="['/materias/carrera', carrera.id]"> </p-button>

      </td>


      @if (rol === 'ADMIN') {

        <td>
          <p-button label="Editar" icon="pi pi-pencil" [routerLink]="['/carrera/editar', carrera.id]"> </p-button>

          <p-button label="Borrar" icon="pi pi-trash" severity="danger" (click)="borrar(carrera.id)"></p-button>
        </td>

      }

    </tr>

  </ng-template>

</p-table>
