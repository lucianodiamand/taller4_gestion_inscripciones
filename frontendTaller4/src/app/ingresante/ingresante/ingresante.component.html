<h2>Ingresantes</h2>

<a routerLink="/ingresante/crear">
  <p-button label="Nuevo Ingresante" icon="pi pi-plus"></p-button>
</a>

<br><br>

<p-table [value]="(ingresantes$ | async) ?? []" stripedRows>

  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>Tipo Documento</th>
      <th>Número Documento</th>
      <th>Edad</th>
      <th>Email</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-ingresante>
    <tr>
      <td>{{ ingresante.id }}</td>
      <td>{{ ingresante.nombre }}</td>
      <td>{{ ingresante.apellido }}</td>
      <td>{{ ingresante.tipoDocumento }}</td>
      <td>{{ ingresante.numeroDocumento }}</td>
      <td>{{ ingresante.edad }}</td>
      <td>{{ ingresante.email }}</td>

      <td>
        <p-button
          label="Editar"
          icon="pi pi-pencil"
          [routerLink]="['/ingreso/editar', ingresante.id]"
        />

        <p-button
          label="Borrar"
          icon="pi pi-trash"
          severity="danger"
          (click)="borrar(ingresante.id)"
        />
      </td>
    </tr>
  </ng-template>

</p-table>
